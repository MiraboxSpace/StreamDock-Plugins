<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title></title>
    <link rel="stylesheet" href="../../static/css/sdpi.css">
    <!-- <link rel="stylesheet" href="../../static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="../../static/css/bootstrap.min.css"> -->
</head>

<body>
    <div class="sdpi-wrapper" style="display: none">
    <!--  -->
    <div type="radio" class="sdpi-item">
        <div class="sdpi-item-label">Type</div>
        <div class="sdpi-item-value">
            <span class="sdpi-item-child">
                <input id="type-set" type="radio" name="type" value="set" checked>
                <label for="type-set" class="sdpi-item-label"><span></span>Set Output</label>
            </span>
            <span class="sdpi-item-child">
                <input id="type-toggle" type="radio" value="toggle" name="type">
                <label for="type-toggle" class="sdpi-item-label"><span></span>Toggle Output</label>
            </span>
            <!-- <span class="sdpi-item-child">
                <input id="type-manage" type="radio" value="manage" name="type">
                <label for="type-manage" class="sdpi-item-label"><span></span>Manage setting</label>
            </span> -->
        </div>
    </div>

    <!--  -->
    <div type="select" class="sdpi-item" id="output-div" style="display: flex;">
        <div class="sdpi-item-label">Output</div>
        <select class="sdpi-item-value" id="output-select">
            <option value="monitor-mix" selected>Monitor Mix</option>
            <option value="stream-mix">Stream Mix</option>
        </select>
    </div>

    <!--  -->
    <div type="select" class="sdpi-item" id="submix-div" style="display: flex;">
        <div class="sdpi-item-label">Submix</div>
        <select class="sdpi-item-value" id="submix-select">
            <!-- c++端获取 -->
        </select>
    </div>

    <!--  -->
    <div type="select" class="sdpi-item" id="primary-div" style="display: flex;">
        <div class="sdpi-item-label">Primary</div>
        <select class="sdpi-item-value" id="primary-select">
            <!-- c++端获取 -->
        </select>
    </div>

    <!--  -->
    <div type="select" class="sdpi-item" id="secondary-div" style="display: flex;">
        <div class="sdpi-item-label">Secondary</div>
        <select class="sdpi-item-value" id="secondary-select">
            <!-- c++端获取 -->
        </select>
    </div>

    </div>
    <script src="../utils/common.js"></script>
    <script src="../utils/action.js"></script>
    <script src="index.js"></script>

</body>

</html>
